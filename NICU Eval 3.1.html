<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NICU Feeding Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Warm minimal palette */
    --bg:#171311;
    --bg-elevated:#201b18;
    --ink:#F4EDE4;
    --text:#E0D1C2;
    --muted:#B9A28E;
    --muted-2:#9B7F68;
    --line:#3B312D;
    --line-soft:#483F3B;
    --accent:#D8895A;
    --accent-hover:#E39A67;
    --accent-soft:rgba(216,137,90,0.18);
    --tag-bg:#352E2A;
    --tag-hover:#433A36;
    --shadow-sm:0 1px 2px rgba(40,30,20,0.04);
    --shadow-md:0 2px 4px rgba(40,30,20,0.04), 0 4px 14px rgba(40,30,20,0.05);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--text);margin:0;padding:0;
    font-size:15px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased;
    font-feature-settings:"cv11";
  }
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px;}

  /* Header */
  header{
    padding:56px 0 28px;
    display:flex;justify-content:space-between;align-items:baseline;
    gap:24px;flex-wrap:wrap;
  }
  header h1{
    margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);
  }
  header .sub{color:var(--muted);font-size:13px;margin-top:6px;}
  header .actions{display:flex;gap:10px;}

  /* Buttons */
  button{
    font:inherit;font-size:13px;padding:7px 14px;
    border:1px solid var(--line);background:var(--bg-elevated);cursor:pointer;
    border-radius:6px;color:var(--ink);font-weight:600;
    transition:all .15s ease;
  }
  button:hover{background:var(--line-soft);border-color:var(--muted-2);}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .link-btn{
    background:transparent;border:none;color:var(--muted);font-size:12px;
    padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:500;
  }
  .link-btn:hover{color:var(--accent);}

  /* TOC */
  .toc{
    position:sticky;top:0;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 32px;z-index:20;
    display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;
    margin:0 -32px;
  }
  .toc a{
    flex-shrink:0;font-size:13px;color:var(--muted);text-decoration:none;
    padding:6px 12px;border-radius:6px;
    display:flex;align-items:center;gap:6px;
    transition:all .15s;white-space:nowrap;font-weight:600;
  }
  .toc a::before{
    content:'';width:6px;height:6px;border-radius:50%;
    border:1.5px solid var(--muted-2);background:transparent;
    transition:all .2s;flex-shrink:0;
  }
  .toc a.completed::before{background:var(--accent);border-color:var(--accent);}
  .toc a:hover{background:var(--line-soft);color:var(--ink);}
  .toc a.active{background:var(--accent-soft);color:var(--accent);}

  /* Main grid — form left, sticky output right */
  .main-grid{
    display:grid;grid-template-columns:minmax(0,1fr) 380px;
    gap:40px;padding-top:8px;
  }
  .form-column{min-width:0;}
  .preview-column{
    position:sticky;top:64px;align-self:start;
    max-height:calc(100vh - 88px);display:flex;flex-direction:column;
  }
  @media (max-width:980px){
    .main-grid{grid-template-columns:1fr;gap:32px;}
    .preview-column{position:static;max-height:none;}
  }

  /* Sections */
  .section-block{
    padding:28px 0 4px;
    scroll-margin-top:72px;
  }
  .section-block:first-child{padding-top:20px;}
  .section-block h2{
    margin:0;font-size:18px;font-weight:700;color:var(--ink);
    letter-spacing:-0.01em;
  }
  .section-header{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;margin:0 0 14px;
  }
  .section-menu{position:relative;}
  .section-menu-btn{
    background:transparent;border:none;color:var(--muted);
    font-size:20px;line-height:1;padding:2px 8px;border-radius:5px;
    cursor:pointer;transition:background .15s,color .15s;
    letter-spacing:1px;
  }
  .section-menu-btn:hover{background:var(--line-soft);color:var(--ink);}
  .section-menu-btn.open{background:var(--line-soft);color:var(--ink);}
  .section-menu-list{
    position:absolute;right:0;top:calc(100% + 4px);z-index:40;
    background:var(--bg-elevated);border:1px solid var(--line);
    border-radius:6px;box-shadow:var(--shadow-md);
    min-width:240px;padding:4px;display:none;
  }
  .section-menu-list.open{display:block;}
  .section-menu-list button{
    display:block;width:100%;text-align:left;
    background:transparent;border:none;padding:8px 12px;
    font-size:13px;color:var(--text);cursor:pointer;border-radius:4px;font-weight:500;
  }
  .section-menu-list button:hover{background:var(--line-soft);color:var(--ink);}

  /* Field labels */
  .field-label{
    font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;
    font-weight:600;margin-bottom:6px;display:block;
  }

  /* Inputs */
  input[type="text"],input[type="number"],select,textarea{
    font:inherit;font-size:14px;padding:9px 12px;
    border:1px solid var(--line);border-radius:6px;
    background:var(--bg-elevated);color:var(--text);width:100%;font-weight:500;
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{min-height:80px;line-height:1.55;resize:vertical;}

  /* Background Info & Logistics grid */
  .grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;}
  .grid-6 label,.grid-6 .field{
    display:flex;flex-direction:column;font-size:12px;color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:600;gap:6px;
  }
  .grid-6 .span2{grid-column:span 2;}
  .grid-6 .span3{grid-column:span 3;}
  .grid-6 .span6{grid-column:span 6;}
  .inline-cbs{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:2px;}
  .inline-cbs label{
    display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);
    font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer;flex-direction:row;
  }
  .inline-cbs input[type="checkbox"]{margin:0;accent-color:var(--accent);}

  /* CB + comment row */
  .cb-comment-row{
    display:grid;grid-template-columns:minmax(160px,30%) 1fr;
    gap:18px;margin-bottom:12px;align-items:start;
  }
  .cb-group{display:flex;flex-direction:column;gap:9px;margin-top:0;}
  .cb-group [data-role="cb-list"]{display:flex;flex-direction:column;gap:7px;}
  .cb-group label{
    display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text);position:relative;font-weight:500;
  }
  .cb-group input[type="checkbox"]{margin:0;flex-shrink:0;accent-color:var(--accent);}
  .cb-del{
    margin-left:auto;color:transparent;font-size:14px;line-height:1;
    padding:0 4px;border-radius:3px;cursor:pointer;transition:color .15s,background .15s;
  }
  .cb-group label:hover .cb-del{color:var(--muted-2);}
  .cb-del:hover{color:var(--ink) !important;background:var(--tag-hover);}
  .cb-add{
    display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;
  }
  .cb-add input{
    flex:1;min-width:100px;font:inherit;font-size:12px;padding:5px 9px;
    border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);font-weight:500;
  }
  .cb-add input:focus{outline:none;border-color:var(--accent);}
  .cb-add button{padding:5px 10px;font-size:11px;}
  .cb-add .link-btn{padding:0;font-size:11px;}
  .comment-col{display:flex;flex-direction:column;}
  .comment-col textarea{min-height:100px;}

  /* Multi-comment */
  .multi-comment-block{margin-bottom:24px;}

  /* Tag system */
  .tag-section{margin-top:16px;}
  .tag-section-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  }
  .tag-section-header .field-label{margin-bottom:0;}
  .tag-list{
    display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:12px;min-height:26px;
  }
  .tag-list .empty-hint{color:var(--muted-2);font-size:12px;font-style:italic;}
  .tag{
    display:inline-flex;align-items:center;gap:1px;
    background:transparent;border:none;padding:0;
    font-size:13px;color:var(--text);cursor:pointer;font-weight:600;
    transition:color .15s;user-select:none;
  }
  .tag .tag-text{
    padding:4px 10px;border-radius:6px;
    background:var(--tag-bg);
    transition:background .15s,color .15s,transform .1s;
  }
  .tag:hover .tag-text{background:var(--tag-hover);}
  .tag:active .tag-text{transform:scale(.97);}
  .tag.flash .tag-text{
    background:var(--accent);color:#fff;animation:tagFlash .6s ease;
  }
  @keyframes tagFlash{
    0%{background:var(--accent);color:#fff;}
    100%{background:var(--tag-bg);color:var(--text);}
  }
  .tag-delete{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;color:transparent;font-size:14px;line-height:1;
    cursor:pointer;transition:color .15s,background .15s;border-radius:4px;margin-left:1px;
  }
  .tag:hover .tag-delete{color:var(--muted);}
  .tag-delete:hover{color:var(--ink) !important;background:var(--tag-hover);}

  /* Drag handle (⋮⋮) — visible on tag hover, left side */
  .tag-drag-handle{
    color:transparent;cursor:grab;padding:0 1px 0 3px;font-size:12px;
    line-height:1;user-select:none;letter-spacing:-2px;
    transition:color .15s;
  }
  .tag:hover .tag-drag-handle{color:var(--muted-2);}
  .tag-drag-handle:active{cursor:grabbing;}

  /* Drag & drop visual states */
  .tag.dragging{opacity:0.35;}
  .tag.drop-before{box-shadow:-2px 0 0 0 var(--accent);}
  .tag.drop-after{box-shadow:2px 0 0 0 var(--accent);}

  /* Smart tag: shows a bold accent-color * after the parent label */
  .tag.tag-smart .tag-text::after{
    content:"*";font-size:16px;color:var(--accent);font-weight:700;
    margin-left:4px;line-height:0;position:relative;top:3px;
  }
  /* Alias tag: displays short label, pastes long text; marked with a → */
  .tag.tag-alias .tag-text::after{
    content:". . .";font-size:11px;color:var(--accent);font-weight:700;
    margin-left:2px;vertical-align:middle;letter-spacing:-1px;
  }

  /* Smart-tag popup: floating panel with mini-tag chips + Insert button */
  .smart-popup{
    position:fixed;z-index:80;
    background:var(--bg-elevated);border:1px solid var(--line);
    border-radius:8px;box-shadow:var(--shadow-md);
    padding:10px 12px;min-width:220px;max-width:360px;
    animation:toast-in .15s ease;
  }
  .smart-popup-header{
    font-size:11px;color:var(--muted);font-weight:600;
    margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .smart-popup-parent{color:var(--text);text-transform:none;font-weight:700;font-size:12.5px;letter-spacing:0;flex:1;}
  .smart-popup-close{
    background:transparent;border:none;color:var(--muted);font-size:16px;
    line-height:1;padding:0 4px;cursor:pointer;border-radius:3px;
  }
  .smart-popup-close:hover{color:var(--ink);background:var(--tag-hover);}
  .smart-popup-mini{
    display:flex;flex-wrap:wrap;gap:4px 5px;margin-bottom:10px;
  }
  .smart-mini{
    background:var(--tag-bg);border:1px solid transparent;
    padding:4px 10px;border-radius:6px;font-size:13px;color:var(--text);font-weight:600;
    cursor:pointer;transition:background .15s,border-color .15s,color .15s;
  }
  .smart-mini:hover{background:var(--tag-hover);}
  .smart-mini.selected{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  .smart-popup-actions{
    display:flex;justify-content:flex-end;gap:6px;
    border-top:1px solid var(--line-soft);padding-top:8px;
  }
  .smart-popup-actions button{padding:5px 12px;font-size:12px;}

  /* Toast notification (bottom-right, for undo delete) */
  .toast{
    position:fixed;bottom:24px;right:24px;
    background:var(--ink);color:#fff;
    padding:10px 14px;border-radius:6px;font-size:13px;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    z-index:100;max-width:400px;
    animation:toast-in .2s ease;
  }
  .toast .toast-msg{color:rgba(255,255,255,.85);}
  .toast .toast-action{
    color:#fff;background:transparent;border:none;padding:0;
    text-decoration:underline;cursor:pointer;font-size:13px;font-weight:700;
  }
  @keyframes toast-in{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  .tag-input{display:flex;gap:8px;align-items:center;}
  .tag-input input{
    flex:1;font:inherit;font-size:13px;padding:7px 11px;
    border:1px solid var(--line);border-radius:6px;
    background:var(--bg-elevated);color:var(--text);font-weight:500;
  }
  .tag-input button{padding:7px 14px;font-size:12px;}

  /* Output section — styled as a sticky panel */
  .output-section{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;
    max-height:calc(100vh - 88px);
    scroll-margin-top:72px;
  }
  .output-section h2{margin:0;font-size:15px;font-weight:700;color:var(--ink);}
  .output-section .live-indicator{
    font-size:10.5px;color:var(--accent);background:var(--accent-soft);
    padding:2px 8px;border-radius:10px;font-style:normal;font-weight:700;
    margin-left:8px;letter-spacing:.2px;text-transform:uppercase;
  }
  .output-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;gap:12px;flex-wrap:wrap;
  }
  .output-tools{display:flex;gap:6px;}
  .output-tools button{padding:5px 11px;font-size:12px;}
  .output-section pre{
    white-space:pre-wrap;background:var(--bg);
    border:1px solid var(--line-soft);
    padding:14px;border-radius:6px;
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
    font-size:11.5px;color:var(--text);margin:0; font-weight:500;
    flex:1;overflow-y:auto;line-height:1.65;
  }

  /* Footer */
  .footer{
    padding:40px 0 56px;font-size:12px;color:var(--muted);line-height:1.6;
    margin-top:48px;border-top:1px solid var(--line);
  }
  .footer p{margin:0;padding-top:24px;}
  .footer b{color:var(--text);font-weight:700;}

  @media print{
    body{padding:0;background:white;}
    .toc,header .actions,.tag-input,.tag-section-header button{display:none !important;}
    .section-block{page-break-inside:avoid;}
    .main-grid{grid-template-columns:1fr;gap:24px;}
    .preview-column{position:static;max-height:none;}
    .output-section{box-shadow:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NICU Feeding Evaluation</h1>
    </div>
    <div class="actions">
      <button onclick="exportCustomizations()" title="Download tags & checkbox options as JSON">Export</button>
      <button onclick="importCustomizations()" title="Import tags & checkbox options from a JSON file">Import</button>
      <button onclick="clearForm()">Clear All</button>
    </div>
  </header>

  <!-- Sticky TOC -->
  <nav class="toc" id="toc"></nav>

  <!-- Two-column layout: form on left, sticky output on right -->
  <div class="main-grid">
    <div class="form-column">
      <div id="sections-container"></div>
    </div>

    <aside class="preview-column">
      <section class="output-section" id="sec_output">
        <div class="output-header">
          <h2>Generated Note <span class="live-indicator">live</span></h2>
          <div class="output-tools">
            <button onclick="copyOutput()">Copy</button>
            <button class="primary" onclick="window.print()">Print</button>
          </div>
        </div>
        <pre id="output">Fill in the form — the note will appear here as you type.</pre>
      </section>
    </aside>
  </div>

  <div class="footer">
    <p><b>Tag persistence:</b> Tags are saved per-section to your browser's localStorage and survive refresh. Each section has its own "Reset to defaults" link. Tags persist across browser sessions as well.</p>
  </div>
</div>

<script>
// ============================================================================
// SECTION DEFINITIONS — shared with the wizard variant
// ============================================================================
const SECTIONS = [
  { id:"background", type:"background", title:"Background Info", short:"Background" },

  {
    id:"readiness", type:"cb-comment-tags", title:"Readiness", short:"Readiness",
    checkboxes:["Physiologic stability","Postural tone","Rooting sequence","State"],
    commentId:"readinessComment", commentLabel:"Readiness Comment",
    defaultTags:[
      "Tachypnea at rest","Tachypnea with handling",
      "O2 desaturations at rest","O2 desaturations with handling",
      "Latent rooting response","Stimulable rooting response","Absent rooting response",
      "Low tone","Mixed tone",
      "Dozy state","Light sleep state","Fussy state"
    ]
  },

  {
    id:"oralmotor", type:"cb-comment-tags", title:"Oral-motor", short:"Oral-motor",
    checkboxes:["Decreased root+latch","Ankyloglossia"],
    commentId:"oralMotorComment", commentLabel:"Oral-motor Comment",
    defaultTags:[
      "Inefficient suction","Strong suction throughout",
      "Compression-only sucking burst","Coordinated suck pattern","Disorganized suck pattern",
      "Excessive milk loss","Trace milk loss",
      "Tongue retraction","Anterior tongue",
      "Jaw instability","Jaw clenching"
    ]
  },

  {
    id:"ssb", type:"cb-comment-tags", title:"S/S/B — Suck/Swallow/Breathe", short:"S/S/B",
    checkboxes:["Obligatory","Alternating","Intermittent","Coordinated","Integrated","Dysfunctional"],
    commentId:"ssbComment", commentLabel:"S/S/B Comment",
    defaultTags:[
      "Long sucking bursts maintained","Short sucking bursts only",
      "Breath holding during burst","Integrated breaths within burst",
      "External pacing required","Self-paced effectively",
      "Dysrhythmic SSB pattern","Smooth nipple-to-suck transition",
      "Gulping/effortful swallows","Yelping at swallow-to-breath transition",
      "Coughing/choking observed"
    ]
  },

  {
    id:"physio", type:"cb-comment-tags", title:"Physiologic Stability", short:"Physio",
    checkboxes:["Abrupt decline","Fluctuating stability","Within normal range"],
    commentId:"physiologicStabilityComment", commentLabel:"Physiologic Stability Comment",
    defaultTags:[
      "Single desaturation event","Multiple desaturation events",
      "Single bradycardia event","Multiple bradycardia events",
      "Color change around mouth","Color change around eyes",
      "Mild distress cues only","Compelling distress cues",
      "VS stable throughout","Recovered with brief rest"
    ]
  },

  {
    id:"engagement", type:"cb-comment-tags", title:"Feeding Engagement", short:"Engagement",
    checkboxes:["Awake","Dozy","Deep sleep","Fussy","Hyper-alert","Light sleep","Quiet alert","State shutdown"],
    commentId:"feedingEngagementComment", commentLabel:"Feeding Engagement Comment",
    defaultTags:[
      "Awake throughout feed","Drowsy after 5 minutes","Drowsy within 5 minutes",
      "Sustained motor tone","Late loss of tone","Early loss of tone",
      "Active feeding engagement","Cued readiness behaviors"
    ]
  },

  {
    id:"tolerance-strategies", type:"multi-comment", title:"Feeding Tolerance & Strategies", short:"Tolerance",
    blocks:[
      {
        commentId:"feedingToleranceComment", commentLabel:"Feeding Tolerance Comment",
        defaultTags:[
          "Tolerated feed well","Required brief rest breaks","Required intervention",
          "Energy maintained throughout","Energy depletion noted","Fluctuating tolerance",
          "VS stable throughout feed"
        ]
      },
      {
        commentId:"feedingStrategiesComment", commentLabel:"Feeding Strategies Comment",
        defaultTags:[
          "Co-regulated pacing","External pacing every 3-4 sucks",
          "Side-lying position","Elevated side-lying",
          "Slow flow nipple","Standard flow nipple",
          "Containment provided","Sensory modifications",
          "Frequent rest breaks","Chin/cheek support"
        ]
      }
    ]
  },

  {
    id:"stateSensory", type:"cb-comment-tags", title:"State/Sensory", short:"State/Sensory",
    checkboxes:["Abrupt change","Hypersensitive","Hyposensitive","Smooth transition"],
    commentId:"stateSensoryComment", commentLabel:"State/Sensory Comment",
    defaultTags:[
      "Smooth state transitions","Abrupt state changes",
      "Hypersensitive to touch","Hyposensitive to stimuli",
      "Required reduced stimulation","Tolerated environmental stimuli",
      "Sensory-seeking behaviors","Calm to alert transition"
    ]
  },

  {
    id:"postFeed", type:"cb-comment-tags", title:"Post Feed Presentation", short:"Post Feed",
    checkboxes:["Physiologic change","State change","State/physiologic stable"],
    commentId:"postFeedComment", commentLabel:"Post Feed Comment",
    defaultTags:[
      "Quiet alert post-feed","Drowsy post-feed","Restless post-feed",
      "Flexed posture maintained","Decreased tone post-feed","Energy depleted",
      "Stable VS post-feed","Required suctioning"
    ]
  },

  {
    id:"clinical-context", type:"multi-comment", title:"Clinical Context", short:"Context",
    blocks:[
      {
        commentId:"compoundingRisk", commentLabel:"Compounding Risk",
        defaultTags:[
          "Prematurity","IVH grade I-II","BPD","GERD/reflux","Cardiac defect",
          "Genetic syndrome","Neurological concerns","Respiratory support"
        ]
      },
      {
        commentId:"historyRelatedToSLP", commentLabel:"History Related to SLP",
        defaultTags:[

const TAG_PREFIX = "nicuTags_onepage_";
const CHECKBOX_PREFIX = "nicuChecks_onepage_";

// ============================================================================
// Customizable checkbox groups — parallel to the tag system, per-section state
// ============================================================================
const CHECKBOX_STATE = {};

function defaultCheckboxesFor(sectionId){
  const sec = SECTIONS.find(s => s.id === sectionId);
  return sec && Array.isArray(sec.checkboxes) ? [...sec.checkboxes] : [];
}
function loadCheckboxesFor(sectionId){
  try {
    const stored = localStorage.getItem(CHECKBOX_PREFIX + sectionId);
    if (stored) {
      const parsed = JSON.parse(stored);
      return Array.isArray(parsed) ? parsed : defaultCheckboxesFor(sectionId);
    }
  } catch (e) { console.warn("loadCheckboxes", sectionId, e); }
  return defaultCheckboxesFor(sectionId);
}
function saveCheckboxesFor(sectionId){
  try { localStorage.setItem(CHECKBOX_PREFIX + sectionId, JSON.stringify(CHECKBOX_STATE[sectionId] || [])); }
  catch (e) { console.warn("saveCheckboxes", sectionId, e); }
}
function mountCheckboxGroup(groupEl){
  const sectionId = groupEl.dataset.sectionId;
  if (!sectionId) return;
  const input   = groupEl.querySelector('[data-role="cb-input"]');
  const addBtn  = groupEl.querySelector('[data-action="add-cb"]');
  const resetBtn = groupEl.querySelector('[data-action="reset-cb"]');
  const list    = groupEl.querySelector('[data-role="cb-list"]');
  if (addBtn) addBtn.addEventListener("click", () => addCheckbox(groupEl));
  if (resetBtn) resetBtn.addEventListener("click", () => resetCheckboxes(groupEl));
  if (input) input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addCheckbox(groupEl); }
  });
  // Delegate delete clicks on the × next to each checkbox label
  if (list) list.addEventListener("click", e => {
    const del = e.target.closest('[data-action="del-cb"]');
    if (!del) return;
    e.preventDefault();
    e.stopPropagation();
    deleteCheckbox(groupEl, del.dataset.value);
  });
}
function rerenderCheckboxList(groupEl){
  const sectionId = groupEl.dataset.sectionId;
  const list = groupEl.querySelector('[data-role="cb-list"]');
  if (!list) return;
  // Preserve which options were currently checked before the rerender
  const currentlyChecked = new Set(
    [...list.querySelectorAll('input[type="checkbox"]:checked')].map(c => c.value)
  );
  list.innerHTML = renderCheckboxListHtml(sectionId);
  // Restore checked state on options that still exist
  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    if (currentlyChecked.has(cb.value)) cb.checked = true;
  });
}
function addCheckbox(groupEl){
  const sectionId = groupEl.dataset.sectionId;
  const input = groupEl.querySelector('[data-role="cb-input"]');
  const value = input.value.trim();
  if (!value) return;
  const boxes = CHECKBOX_STATE[sectionId] || (CHECKBOX_STATE[sectionId] = []);
  if (boxes.some(b => b.toLowerCase() === value.toLowerCase())) {
    alert("That option already exists in this section.");
    input.select();
    return;
  }
  boxes.push(value);
  saveCheckboxesFor(sectionId);
  rerenderCheckboxList(groupEl);
  input.value = "";
  input.focus();
  scheduleRegen();
  updateCompletionDots();
}
function deleteCheckbox(groupEl, value){
  const sectionId = groupEl.dataset.sectionId;
  const boxes = CHECKBOX_STATE[sectionId] || [];
  const idx = boxes.indexOf(value);
  if (idx < 0) return;
  boxes.splice(idx, 1);
  saveCheckboxesFor(sectionId);
  rerenderCheckboxList(groupEl);
  scheduleRegen();
  updateCompletionDots();
}
function resetCheckboxes(groupEl){
  const sectionId = groupEl.dataset.sectionId;
  if (!confirm("Reset this section's options to the defaults? Any custom options here will be lost.")) return;
  CHECKBOX_STATE[sectionId] = defaultCheckboxesFor(sectionId);
  saveCheckboxesFor(sectionId);
  rerenderCheckboxList(groupEl);
  scheduleRegen();
  updateCompletionDots();
}

function renderAll(){
  renderTOC();
  const root = document.getElementById("sections-container");
  let html = "";
  SECTIONS.forEach(sec => {
    html += `<section class="section-block" id="sec_${sec.id}">`;
    html += `<div class="section-header">
      <h2>${escapeHtml(sec.title)}</h2>
      ${renderSectionMenu(sec)}

    if (sec.type === "background")           html += renderBackground();
    else if (sec.type === "cb-comment-tags") html += renderCbCommentTags(sec);
    else if (sec.type === "multi-comment")   html += renderMultiComment(sec);
    else if (sec.type === "logistics")       html += renderLogistics();
    html += `</section>`;
  });
  root.innerHTML = html;
  document.querySelectorAll('.tag-section[data-comment-id]').forEach(mountTagBar);
  document.querySelectorAll('.cb-group[data-section-id]').forEach(mountCheckboxGroup);
  document.querySelectorAll('.section-menu-btn').forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); toggleSectionMenu(btn); });
  });

      handleSectionMenuAction(btn.dataset.action, btn.dataset.target);

}

// Build the ⋯ menu for a section. Returns empty string for sections with no
// resettable content (Background, Logistics, Output).
function renderSectionMenu(sec){
  const items = [];
  if (sec.type === "cb-comment-tags") {
    items.push({label:"Reset checkbox options to defaults", action:"reset-cb", target:sec.id});
    items.push({label:"Reset tags to defaults", action:"reset-tags", target:sec.commentId});
  } else if (sec.type === "multi-comment") {
    if (sec.blocks.length === 1) {
      items.push({label:"Reset tags to defaults", action:"reset-tags", target:sec.blocks[0].commentId});
    } else {
      sec.blocks.forEach(block => {
        items.push({label:`Reset "${block.commentLabel}" tags`, action:"reset-tags", target:block.commentId});
      });
    }
  }
  if (!items.length) return "";
  const menuItems = items.map(item =>
    `<button data-action="${item.action}" data-target="${escapeAttr(item.target)}">${escapeHtml(item.label)}</button>`
  ).join("");
  return `
    <div class="section-menu">
      <button class="section-menu-btn" title="Section options" aria-label="Section options">⋯</button>
      <div class="section-menu-list">${menuItems}</div>
    </div>
  `;
}

function toggleSectionMenu(btn){
  const menu = btn.nextElementSibling;
  if (!menu) return;
  const wasOpen = menu.classList.contains("open");
  closeAllSectionMenus();
  if (!wasOpen) {
    menu.classList.add("open");
    btn.classList.add("open");
  }
}

function closeAllSectionMenus(){
  document.querySelectorAll('.section-menu-list.open').forEach(m => m.classList.remove("open"));
  document.querySelectorAll('.section-menu-btn.open').forEach(b => b.classList.remove("open"));
}

// Global click-outside handler to close open section menus
document.addEventListener("click", e => {
  if (!e.target.closest(".section-menu")) closeAllSectionMenus();
});

function handleSectionMenuAction(action, target){
  if (action === "reset-cb") {
    const groupEl = document.querySelector(`.cb-group[data-section-id="${target}"]`);
    if (groupEl) resetCheckboxes(groupEl);
  } else if (action === "reset-tags") {
    const barEl = document.querySelector(`.tag-section[data-comment-id="${target}"]`);
    if (barEl) resetTags(barEl);
  }
}

// ============================================================================
// Tag management (one localStorage key per comment textarea)
// ============================================================================
const TAG_STATE = {};

function defaultsFor(commentId){
  for (const sec of SECTIONS) {
    if (sec.commentId === commentId) return sec.defaultTags || [];
    if (sec.blocks) for (const b of sec.blocks) if (b.commentId === commentId) return b.defaultTags || [];
  }
  return [];
}
function loadTagsFor(commentId){
  try {
    const stored = localStorage.getItem(TAG_PREFIX + commentId);
    if (stored) {
      const parsed = JSON.parse(stored);
      return Array.isArray(parsed) ? parsed : [...defaultsFor(commentId)];
    }
  } catch (e) { console.warn("loadTags", commentId, e); }
  return [...defaultsFor(commentId)];
}
function saveTagsFor(commentId){
  try { localStorage.setItem(TAG_PREFIX + commentId, JSON.stringify(TAG_STATE[commentId] || [])); }
  catch (e) { console.warn("saveTags", commentId, e); }
}
function mountTagBar(barEl){
  const commentId = barEl.dataset.commentId;
  if (!commentId) return;
  if (!TAG_STATE[commentId]) {
    TAG_STATE[commentId] = loadTagsFor(commentId);
    if (!localStorage.getItem(TAG_PREFIX + commentId)) saveTagsFor(commentId);
  }
  renderTagList(barEl);
  barEl.querySelector('[data-action="add"]').addEventListener("click", () => addTag(barEl));
  const _resetBtn = barEl.querySelector('[data-action="reset"]');
  if (_resetBtn) _resetBtn.addEventListener("click", () => resetTags(barEl));
  barEl.querySelector('[data-role="input"]').addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addTag(barEl); }
  });
}
function renderTagList(barEl){
  const commentId = barEl.dataset.commentId;
  const list = barEl.querySelector('[data-role="list"]');
  const tags = TAG_STATE[commentId] || [];
  list.innerHTML = "";
  if (!tags.length) {
    const hint = document.createElement("span");
    hint.className = "empty-hint";
    hint.textContent = "No tags yet — add some below.";
    list.appendChild(hint);
    return;
  }
  tags.forEach((tag, i) => {
    const chip = document.createElement("div");
    chip.className = "tag";
    chip.draggable = true;
    chip.dataset.index = String(i);

    const handle = document.createElement("span");
    handle.className = "tag-drag-handle";
    handle.textContent = "⋮⋮";
    handle.title = "Drag to reorder";

    // Tag-type detection. Two special formats, checked in order:
    //   ALIAS: "<short label> long text to insert"
    //     — chip shows the short label; click inserts the long text.
    //   SMART: "parent: mini1, mini2, mini3"
    //     — chip opens a popup where clinician picks one or more sub-tags.
    // Otherwise it's a plain tag.
    const alias  = parseAliasTag(tag);
    const parsed = alias ? { isSmart:false } : parseSmartTag(tag);
    if (alias)          chip.classList.add("tag-alias");
    else if (parsed.isSmart) chip.classList.add("tag-smart");

    const txt = document.createElement("span");
    txt.className = "tag-text";
    txt.textContent = alias ? alias.display : (parsed.isSmart ? parsed.parent : tag);

    const del = document.createElement("span");
    del.className = "tag-delete";
    del.textContent = "×";
    del.title = "Delete this tag";
    del.addEventListener("click", e => {
      e.stopPropagation();
      deleteTagAtIndex(barEl, i);
    });

    chip.appendChild(handle);
    chip.appendChild(txt);
    chip.appendChild(del);

    // Cursor capture: on mousedown, snapshot the textarea's caret position
    // BEFORE focus moves to the chip. Used by insertTagAtCaret in the
    // Impressions section. We can't preventDefault mousedown anymore
    // because that would block HTML5 drag initiation.
    chip.addEventListener("mousedown", () => {
      const ta = document.getElementById(commentId);
      if (ta && document.activeElement === ta) {
        LAST_CURSOR[commentId] = { start: ta.selectionStart, end: ta.selectionEnd };
      }
    });

    chip.addEventListener("click", () => {
      if (parsed.isSmart) {
        openSmartPopup(barEl, commentId, tag, parsed, i);
      } else {
        insertTagAtComment(commentId, alias ? alias.value : tag);
      }
    });

    chip.addEventListener("dragstart", e => {
      draggedTag = { barEl, index: i, text: tag };
      chip.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", tag);
    });

    chip.addEventListener("dragend", () => {
      chip.classList.remove("dragging");
      draggedTag = null;
      document.querySelectorAll('.tag').forEach(el => {
        el.classList.remove('drop-before','drop-after');
      });
    });

    chip.addEventListener("dragover", e => {
      e.preventDefault();
      const items = [...list.children];
      const currentIndex = items.indexOf(chip);
      const rect = chip.getBoundingClientRect();
      const before = e.clientX < rect.left + rect.width / 2;
      chip.classList.remove('drop-before','drop-after');
      chip.classList.add(before ? 'drop-before' : 'drop-after');
    });

    chip.addEventListener("drop", e => {
      e.preventDefault();
      const from = draggedTag && draggedTag.index;
      if (from == null) return;
      const targetIndex = i;
      const before = e.clientX < chip.getBoundingClientRect().left + chip.getBoundingClientRect().width / 2;
      const finalIndex = before ? targetIndex : targetIndex + 1;
      reorderTagAtIndex(barEl, from, finalIndex);
      chip.classList.remove('drop-before','drop-after');
    });

    list.appendChild(chip);
  });
}

function addTag(barEl){
  const commentId = barEl.dataset.commentId;
  const input = barEl.querySelector('[data-role="input"]');
  if (!input) return;
  const value = input.value.trim();
  if (!value) return;
  const tags = TAG_STATE[commentId] || (TAG_STATE[commentId] = []);
  const lower = value.toLowerCase();
  if (tags.some(t => t.toLowerCase() === lower)) {
    input.value = "";
    input.focus();
    return;
  }
  tags.push(value);
  saveTagsFor(commentId);
  renderTagList(barEl);
  input.value = "";
  input.focus();
  scheduleRegen();
}

function deleteTagAtIndex(barEl, index){
  const commentId = barEl.dataset.commentId;
  const tags = TAG_STATE[commentId] || [];
  if (index < 0 || index >= tags.length) return;
  const removed = tags.splice(index, 1)[0];
  saveTagsFor(commentId);
  renderTagList(barEl);
  scheduleRegen();
  showUndoToast(removed, commentId, index);
}

function reorderTagAtIndex(barEl, fromIndex, toIndex){
  const commentId = barEl.dataset.commentId;
  const tags = TAG_STATE[commentId] || [];
  if (fromIndex < 0 || fromIndex >= tags.length) return;
  const [moved] = tags.splice(fromIndex, 1);
  if (moved == null) return;
  const clamped = Math.max(0, Math.min(toIndex, tags.length));
  tags.splice(clamped, 0, moved);
  saveTagsFor(commentId);
  renderTagList(barEl);
  scheduleRegen();
}

function resetTags(barEl){
  const commentId = barEl.dataset.commentId;
  const defaults = defaultsFor(commentId);
  TAG_STATE[commentId] = [...defaults];
  saveTagsFor(commentId);
  renderTagList(barEl);
  scheduleRegen();
}

function showUndoToast(removed, commentId, index){
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = `<span class="toast-msg">Removed “${escapeHtml(removed)}”</span><button class="toast-action" type="button">Undo</button>`;
  document.body.appendChild(toast);
  const action = toast.querySelector(".toast-action");
  action.addEventListener("click", () => {
    const tags = TAG_STATE[commentId] || [];
    tags.splice(index, 0, removed);
    saveTagsFor(commentId);
    renderTagList(document.querySelector(`.tag-section[data-comment-id="${commentId}"]`));
    scheduleRegen();
    toast.remove();
  });
  setTimeout(() => toast.remove(), 4000);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(str) {
  return escapeHtml(str);
}

function parseAliasTag(tag){
  const match = /^(.+?)\s+(.+)$/.exec(tag.trim());
  if (!match) return null;
  const shortLabel = match[1].trim();
  const longText = match[2].trim();
  if (!shortLabel || !longText) return null;
  return { display: shortLabel, value: longText };
}

function parseSmartTag(tag){
  const match = /^(.+?)\s*:\s*(.+)$/.exec(tag.trim());
  if (!match) return { isSmart: false };
  const parent = match[1].trim();
  const rest = match[2].trim();
  if (!parent || !rest) return { isSmart: false };
  const vals = rest.split(',').map(v => v.trim()).filter(Boolean);
  return { isSmart: true, parent, values: vals };
}

function openSmartPopup(barEl, commentId, tag, parsed, index){
  closeSmartPopup();
  const popup = document.createElement("div");
  popup.className = "smart-popup";
  popup.innerHTML = `
    <div class="smart-popup-header">
      <div class="smart-popup-parent">${escapeHtml(parsed.parent)}</div>
      <button class="smart-popup-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="smart-popup-mini"></div>
    <div class="smart-popup-actions">
      <button type="button" data-action="cancel">Cancel</button>
      <button type="button" class="primary" data-action="insert">Insert</button>
    </div>
  `;

  const miniContainer = popup.querySelector('.smart-popup-mini');
  const vals = parsed.values.length ? parsed.values : [parsed.parent];
  let selected = new Set(vals);

  vals.forEach(value => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'smart-mini selected';
    btn.textContent = value;
    btn.addEventListener('click', () => {
      if (selected.has(value)) {
        selected.delete(value);
        btn.classList.remove('selected');
      } else {
        selected.add(value);
        btn.classList.add('selected');
      }
    });
    miniContainer.appendChild(btn);
  });

  popup.querySelector('.smart-popup-close').addEventListener('click', closeSmartPopup);
  popup.querySelector('[data-action="cancel"]').addEventListener('click', closeSmartPopup);
  popup.querySelector('[data-action="insert"]').addEventListener('click', () => {
    const chosen = [...selected];
    if (!chosen.length) return closeSmartPopup();
    const inserted = chosen.join(', ');
    insertTagAtComment(commentId, inserted);
    closeSmartPopup();
  });

  const ta = document.getElementById(commentId);
  const rect = ta ? ta.getBoundingClientRect() : { left: window.innerWidth / 2, top: 80 };
  popup.style.left = `${Math.max(16, Math.min(window.innerWidth - 260, rect.left + 24))}px`;
  popup.style.top = `${Math.max(16, rect.top + 24)}px`;
  document.body.appendChild(popup);
}

function closeSmartPopup(){
  document.querySelectorAll('.smart-popup').forEach(el => el.remove());
}

function insertTagAtComment(commentId, text){
  const ta = document.getElementById(commentId);
  if (!ta) return;
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, start);
  const after = ta.value.slice(end);
  ta.value = before + text + after;
  ta.focus();
  const pos = start + text.length;
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  scheduleRegen();
}

function scheduleRegen(){
  if (window.__regenTimer) clearTimeout(window.__regenTimer);
  window.__regenTimer = setTimeout(() => {
    if (window.generateNote) window.generateNote();
  }, 0);
}

function generateNote(){
  const output = document.getElementById('output');
  if (!output) return;

  const lines = [];
  const push = v => { if (v && String(v).trim()) lines.push(String(v).trim()); };

  push(document.getElementById('admit_dx')?.value);
  const ga = document.getElementById('ga')?.value;
  const pma = document.getElementById('pma')?.value;
  if (ga || pma) push(`GA ${ga || '—'} / PMA ${pma || '—'}`);
  push(document.getElementById('feed_order')?.value);

  const slpValues = [...document.querySelectorAll('input[name="slp_order_cb"]:checked')].map(cb => cb.value);
  if (slpValues.length) push(`SLP order: ${slpValues.join(', ')}`);

  const feedDiffs = [...document.querySelectorAll('input[name="feed_diff_cb"]:checked')].map(cb => cb.value);
  if (feedDiffs.length) push(`Feeding difficulties secondary to: ${feedDiffs.join(', ')}`);

  const gatherTextArea = id => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  };

  const sectionIds = [
    'readinessComment','oralMotorComment','ssbComment','physiologicStabilityComment','feedingEngagementComment',
    'feedingToleranceComment','feedingStrategiesComment','stateSensoryComment','postFeedComment',
    'compoundingRisk','historyRelatedToSLP','impressions','recommendationsComment'
  ];

  sectionIds.forEach(id => {
    const text = gatherTextArea(id);
    if (text) push(text);
  });

  const bottle = document.getElementById('bottle')?.value;
  const position = document.getElementById('feedingPosition')?.value;
  const length = document.getElementById('lengthOfFeed')?.value;
  const volume = document.getElementById('volumeConsumed')?.value;
  const logistics = [bottle, position, length, volume].filter(Boolean);
  if (logistics.length) push(`Logistics: ${logistics.join(' | ')}`);

  const strategiesUsed = document.getElementById('strategiesUsed')?.value.trim();
  if (strategiesUsed) push(`Strategies used: ${strategiesUsed}`);
  const plan = document.getElementById('planOfCare')?.value.trim();
  if (plan) push(`Plan of care: ${plan}`);

  output.textContent = lines.length ? lines.join('\n\n') : 'Fill in the form — the note will appear here as you type.';
}

window.generateNote = generateNote;

document.addEventListener('input', generateNote);
document.addEventListener('change', generateNote);

const LAST_CURSOR = {};
let draggedTag = null;

window.addEventListener('load', () => {
  renderAll();
  generateNote();
});
</script>
